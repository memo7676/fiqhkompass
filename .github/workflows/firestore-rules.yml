# Tests the Firestore rules and publishes them to Firebase whenever firestore.rules changes.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (see SETUP.md). Without it, only the tests run.
name: Firestore-Regeln

on:
  push:
    branches: [claude/fiqh-reference-quiz-5ykw73]
    paths: [firestore.rules, firebase.json, tests/**]
  workflow_dispatch:

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Regeln im Emulator testen
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Bei Google anmelden
        if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Regeln in Firebase veröffentlichen
        if: env.HAS_KEY == 'true'
        working-directory: tests
        run: npx firebase deploy --only firestore:rules --project fiqh-kompass --non-interactive --config ../firebase.json

      - name: Hinweis ohne Schlüssel
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Kein FIREBASE_SERVICE_ACCOUNT hinterlegt – Regeln wurden nur getestet, nicht veröffentlicht (siehe SETUP.md)."
